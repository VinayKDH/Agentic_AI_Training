apiVersion: v1
kind: Namespace
metadata:
  name: agentic-ai
  labels:
    app.kubernetes.io/name: day3-advanced
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: day3-agent
  namespace: agentic-ai
  annotations:
    iam.gke.io/gcp-service-account: day3-agent@testkuberiq.iam.gserviceaccount.com
---
apiVersion: v1
kind: Secret
metadata:
  name: day3-agent-secrets
  namespace: agentic-ai
type: Opaque
stringData:
  SECRET_KEY: day3-advanced-prod-secret-change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: day3-advanced
  namespace: agentic-ai
  labels:
    app: day3-advanced
spec:
  replicas: 1
  selector:
    matchLabels:
      app: day3-advanced
  template:
    metadata:
      labels:
        app: day3-advanced
    spec:
      serviceAccountName: day3-agent
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/testkuberiq/agentic-ai/day3-advanced:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LLM_PROVIDER
              value: vertex
            - name: GCP_PROJECT
              value: testkuberiq
            - name: VERTEX_LOCATION
              value: us-central1
            - name: VERTEX_MODEL
              value: gemini-2.5-flash
            - name: REDIS_ENABLED
              value: "false"
            - name: CACHE_ENABLED
              value: "false"
            - name: RATE_LIMIT_ENABLED
              value: "false"
            - name: LANGCHAIN_TRACING_V2
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: day3-agent-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: day3-advanced
  namespace: agentic-ai
  labels:
    app: day3-advanced
spec:
  type: LoadBalancer
  selector:
    app: day3-advanced
  ports:
    - name: http
      port: 80
      targetPort: 8000
